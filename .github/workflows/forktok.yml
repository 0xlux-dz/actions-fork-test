name: forktok
on: pull_request
permissions: write-all
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "repo=${{ github.repository }} pr=${{ github.event.pull_request.number }}"
          echo -n "GET /user -> "; curl -s -o /dev/null -w "%{http_code}\n" -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/user
          echo -n "POST comment -> "; curl -s -o /tmp/r.json -w "%{http_code}\n" -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Content-Type: application/json" -d '{"body":"fork token write probe"}' https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments
          head -c 300 /tmp/r.json; echo
